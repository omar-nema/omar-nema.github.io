html,body{margin:0;height:100%}
body{background:#e4e6ea;color:#161616;font-family:Manrope,"Helvetica Neue",Arial,sans-serif;overflow:hidden}
.stage{display:flex;flex-direction:column;height:100vh}

.count{position:absolute;right:24px;top:50%;transform:translateY(-50%);font-size:14px;font-weight:600;color:rgba(255,255,255,.55)}
.tag{position:absolute;left:24px;top:50%;transform:translateY(-50%);font-size:12px;line-height:16px;font-weight:600;color:rgba(255,255,255,.42)}

nav{flex:none;height:48px;display:flex;align-items:center;justify-content:center}
nav button{width:22px;height:32px;border:0;background:none;padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center}
nav i{display:block;width:8px;height:8px;border-radius:50%;background:#b4b8bf;transition:background-color .2s,transform .2s}
nav button:hover i{background:#8c9099}
nav button[aria-current="step"] i{background:#161616;transform:scale(1.2)}
.row{flex:1;position:relative;min-height:0;overflow:hidden}
.arrow{position:absolute;top:50%;width:56px;height:56px;margin-top:-28px;border-radius:50%;background:#fff;border:0;color:#161616;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:5;box-shadow:0 1px 2px rgba(17,23,28,.08),0 4px 14px rgba(17,23,28,.14);transition:opacity .2s,transform .2s}
.arrow:hover{transform:scale(1.06)}
.arrow:focus-visible,nav button:focus-visible{outline:2px solid #161616;outline-offset:2px}
.arrow[disabled]{opacity:0;pointer-events:none}
.prev{left:24px}.next{right:24px}
.slide{position:absolute;top:0;left:50%;transition:transform .65s cubic-bezier(.22,.61,.36,1),opacity .5s ease;will-change:transform,opacity}
.slide[aria-hidden="true"]{pointer-events:none}
.win{border-radius:12px;background:#f7f7f7;overflow:hidden;box-shadow:0 0 0 1px rgba(17,23,28,.08),0 2px 6px rgba(17,23,28,.06),0 28px 56px -16px rgba(17,23,28,.22)}
.bar{height:41px;background:#edeef0;display:flex;align-items:center;position:relative;border-bottom:1px solid rgba(17,23,28,.07)}
.lights{position:absolute;left:14px;display:flex;gap:8px}
.lights span{width:12px;height:12px;border-radius:50%}
.url{margin:0 auto;height:24px;width:min(560px,56%);background:#fff;border-radius:6px;display:flex;align-items:center;justify-content:center;gap:6px;font:500 13px/1 Manrope,"Helvetica Neue",Arial,sans-serif;color:#3c4043;overflow:hidden;white-space:nowrap}
.view{position:relative;overflow:hidden;background:#fff}
.screen{position:absolute;left:0;top:0;width:1725px;height:907px;transform-origin:0 0}
</style>
</head>

<script>
/* Minimal runtime for the exported design screens: {{holes}}, sc-if, data-for rows, onClick/onChange, setState. */
window.__DCREG = {};
class DCLogic {
  constructor(props) { this.props = props || {}; this.state = {}; }
  setState(p) { const n = typeof p === 'function' ? p(this.state, this.props) : p; this.state = Object.assign({}, this.state, n); if (this._render) this._render(); }
  forceUpdate() { if (this._render) this._render(); }
}
window.DCLogic = DCLogic;
(function () {
  const HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;
  const ONE = /^\s*\{\{\s*([^}]+?)\s*\}\}\s*$/;
  function look(p, scope) {
    p = p.trim();
    if (p === 'true') return true; if (p === 'false') return false;
    if (/^-?\d+(\.\d+)?$/.test(p)) return +p;
    let v = scope; for (const k of p.split('.')) { if (v == null) return undefined; v = v[k]; } return v;
  }
  const interp = (s, scope) => s.replace(HOLE, (m, p) => { const v = look(p, scope); return v == null ? '' : String(v); });
  function node(n, scope, out) {
    if (n.nodeType === 3) { out.push(document.createTextNode(n.nodeValue.indexOf('{{') < 0 ? n.nodeValue : interp(n.nodeValue, scope))); return; }
    if (n.nodeType !== 1) return;
    if (n.localName === 'sc-if') { const m = (n.getAttribute('value') || '').match(ONE); if (m && look(m[1], scope)) for (const c of n.childNodes) node(c, scope, out); return; }
    if (n.hasAttribute('data-for')) {
      const list = look(n.getAttribute('data-for'), scope) || []; const as = n.getAttribute('data-as') || 'item';
      list.forEach((it, i) => { const s = Object.create(scope); s[as] = it; s.$index = i; el(n, s, out); }); return;
    }
    el(n, scope, out);
  }
  function el(n, scope, out) {
    const e = document.importNode(n, false);
    for (const a of [...e.attributes]) {
      const name = a.name, val = a.value;
      if (name === 'data-for' || name === 'data-as' || name.startsWith('hint-')) { e.removeAttribute(name); continue; }
      if (name.startsWith('on')) {
        e.removeAttribute(name);
        const m = val.match(ONE); const fn = m && look(m[1], scope);
        if (typeof fn === 'function') e.addEventListener(name.slice(2), ev => fn(ev));
        continue;
      }
      if (val.indexOf('{{') < 0) continue;
      const m = val.match(ONE);
      if (name === 'checked') { e.removeAttribute('checked'); const on = !!(m && look(m[1], scope)); e.checked = on; e.defaultChecked = on; continue; }
      e.setAttribute(name, interp(val, scope));
    }
    const kids = []; for (const c of n.childNodes) node(c, scope, kids);
    for (const k of kids) e.appendChild(k);
    out.push(e);
  }
  window.mountScreen = function (host, scr, onGo) {
    const root = host.attachShadow({ mode: 'open' });
    const style = document.createElement('style');
    style.textContent = 'sc-if,sc-for{display:contents}.dc-body{width:1725px;height:907px;overflow:hidden;position:relative;margin:0;font-family:Manrope,"Helvetica Neue",Arial,sans-serif;color:#2e2e27;-webkit-font-smoothing:antialiased}.dc-body.email{width:1280px;height:673px;overflow-y:auto;display:flex;justify-content:center;background:#ebe8e5}.dc-body.email::-webkit-scrollbar{width:10px}.dc-body.email::-webkit-scrollbar-thumb{background:#c9c7bd;border-radius:5px}' +
      /* while hovering the window, the step\'s [data-action] element fades into a steady glow. The glow is an
         overlay at the top of the screen (so cards with overflow:hidden can\'t clip it); --k undoes the screen\'s scale. */
      '.dc-glow{position:absolute;pointer-events:none;z-index:2147483647;opacity:0;transition:opacity .35s ease;box-shadow:0 0 0 calc(3px * var(--k, 1)) rgba(34,114,180,.45),0 0 calc(22px * var(--k, 1)) calc(8px * var(--k, 1)) rgba(34,114,180,.5)}:host(.hot) .dc-glow.on{opacity:1}\n' + scr.css;
    const body = document.createElement('div'); body.className = 'dc-body' + (scr.email ? ' email' : '');
    root.append(style, body);
    const glow = document.createElement('div'); glow.className = 'dc-glow';
    function placeGlow() {
      if (glow.parentNode !== body) body.appendChild(glow);
      const a = body.querySelector('[data-action]');
      if (!a || !a.getClientRects().length) { glow.classList.remove('on'); return; }
      const br = body.getBoundingClientRect(), ar = a.getBoundingClientRect(), s = br.width / body.offsetWidth || 1;
      glow.style.left = ((ar.left - br.left) / s + body.scrollLeft) + 'px';
      glow.style.top = ((ar.top - br.top) / s + body.scrollTop) + 'px';
      glow.style.width = (ar.width / s) + 'px'; glow.style.height = (ar.height / s) + 'px';
      glow.style.borderRadius = getComputedStyle(a).borderRadius;

    }
    const win = host.closest('.win');
    if (win) {
      win.addEventListener('mouseenter', () => { placeGlow(); host.classList.add('hot'); });
      win.addEventListener('mouseleave', () => host.classList.remove('hot'));
    }
    root.addEventListener('scroll', e => { if (e.target !== body) placeGlow(); }, true);
    window.addEventListener('resize', () => requestAnimationFrame(placeGlow));
    const tpl = document.createElement('template'); tpl.innerHTML = scr.markup;
    const C = window.__DCREG[scr.name]; const inst = new C({}); if (!inst.state) inst.state = {};
    function render() {
      const before = body.querySelectorAll('*'); const saved = [];
      before.forEach((x, i) => { if (x.scrollTop || x.scrollLeft) saved.push([i, x.scrollTop, x.scrollLeft]); });
      const bodyTop = body.scrollTop;
      const vals = inst.renderVals ? inst.renderVals() : {};
      const scope = Object.assign({}, vals); const out = [];
      for (const c of tpl.content.childNodes) node(c, scope, out);
      body.replaceChildren(...out);
      const after = body.querySelectorAll('*');
      saved.forEach(([i, t, l]) => { if (after[i]) { after[i].scrollTop = t; after[i].scrollLeft = l; } });
      body.scrollTop = bodyTop;
      placeGlow();
    }
    inst._render = render;
    body.addEventListener('click', ev => {
      const a = ev.target.closest('a'); if (!a) return;
      const h = a.getAttribute('href') || '';
      if (/\.dc\.html$/.test(h)) { ev.preventDefault(); onGo(h.replace(/^.*\//, '').replace('.dc.html', '')); }
      else if (!/^https?:/.test(h)) ev.preventDefault();
    });
    render();
    if (inst.componentDidMount) inst.componentDidMount();
  };
})();
</script>

window.__DCREG["Vendor"]=(function(DCLogic){

class Component extends DCLogic {
renderVals() {
const st = this.state || {};
const choice = st.choice || 'a';
const started = !!st.started;
const labels = { a: '26 seats with a $170 target price', b: '26 seats at $192', c: '40 seats at $192' };
const on = '#5683d2', off = '#dbdac9';
return {
started: started, notStarted: !started,
isA: choice === 'a', isB: choice === 'b', isC: choice === 'c',
borderA: choice === 'a' ? on : off, borderB: choice === 'b' ? on : off, borderC: choice === 'c' ? on : off,
choiceLabel: labels[choice],
pickA: () => this.setState({ choice: 'a' }),
pickB: () => this.setState({ choice: 'b' }),
pickC: () => this.setState({ choice: 'c' }),
start: () => this.setState({ started: true }),
undo: () => this.setState({ started: false })
};
}
}

return Component;
})(window.DCLogic);

window.__DCREG["Request2"]=(function(DCLogic){

class Component extends DCLogic {
renderVals() {
const st = this.state || {};
// The worst 3 are selected by default; the other 3 are past replacement mileage but still cheaper to keep.
const sel = st.sel || { 'Van 04': true, 'Van 09': true, 'Van 11': true };
// [name, year, est. miles, repairs last 12 months, expected repairs next 12 months]
const base = [['Van 04','2017','~148K',6900,9800],['Van 09','2018','~139K',5600,8100],['Van 11','2018','~132K',5200,7600],['Van 15','2018','~127K',4300,6000],['Van 17','2019','~124K',3900,5300],['Van 22','2019','~121K',3200,4300]];
const NEW_VAN_PER_YEAR = 7400; // ($54,500 − $7,500 trade-in) / 7 years + ~$700 upkeep
const TRADE_IN = 7500, LAST_PRICE = 54500, PEER_PRICE = 52900;
const usd = (n) => '$' + Math.round(n).toLocaleString('en-US');
const fmt = (n) => (n < 0 ? '−$' : '$') + Math.abs(n).toLocaleString('en-US') + '.00';
const vans = base.map((r) => {
const on = !!sel[r[0]];
return { name: r[0], year: r[1], miles: r[2], repairs: usd(r[3]), next: '~' + usd(r[4]), on: on, op: on ? 1 : 0.45,
toggle: () => { const next = Object.assign({}, sel); next[r[0]] = !on; this.setState({ sel: next }); } };
});
const picked = base.filter((r) => sel[r[0]]);
const qty = picked.length;
const rate = st.peer ? PEER_PRICE : LAST_PRICE;
const total = qty * (rate - TRADE_IN);
return { vans: vans, qty: String(qty), rate: fmt(rate), vanAmt: fmt(qty * rate), tradeAmt: fmt(-qty * TRADE_IN), total: fmt(total),
keep: '~' + usd(picked.reduce((a, r) => a + r[4], 0)), replace: '~' + usd(qty * NEW_VAN_PER_YEAR),
budgetUse: usd(total) + ' of it',

}

return Component;
})(window.DCLogic);

<script>
(function () {
  const SCREENS = [{"name": "Email", "url": "mail.fernway.com/inbox", "lead": "Renewals, before the deadline.", "rest": "Before Figma renews, Ramp emails the vendor owner: many seats are going unused, and peers pay less per seat.", "email": true, "group": "figma", "groupLabel": "Renewal", "css": "\n.dc-body{margin:0;font-family:Manrope,\"Helvetica Neue\",Arial,sans-serif;color:#2e2e27;-webkit-font-smoothing:antialiased}\na{color:inherit}a:hover{color:#2e2e27}\n.lb{font-size:12px;line-height:16px;font-weight:300;color:#707062}\n.oc{display:grid;grid-template-columns:96px 1fr;gap:16px;padding:16px 0;border-bottom:1px solid #ebe8e5}\n.oc-n{font-size:18px;line-height:24px;font-weight:400;letter-spacing:-0.2px}\n.oc-t{font-size:14px;line-height:20px;font-weight:500}\n.oc-d{margin-top:2px;font-size:14px;line-height:22px;font-weight:300}\n", "markup": "\n<div style=\"width: 1280px; min-height: 960px; align-self: flex-start; box-sizing: border-box; background: #ebe8e5; display: flex; flex-direction: column\">\n\n<!-- Generic mail reader header -->\n<div style=\"flex: 0 0 auto; background: #ffffff; border-bottom: 1px solid #dbdac9; padding: 28px 48px 20px\">\n<div style=\"font-size: 18px; line-height: 26px; font-weight: 500\">Figma renews in 78 days: renew at 26 seats and save about $3,260 a year<\/div>\n<div style=\"display: flex; align-items: center; gap: 12px; margin-top: 16px\">\n<span style=\"width: 36px; height: 36px; border-radius: 907px; background: #2e2e27; color: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 500\">R<\/span>\n<div style=\"flex: 1\">\n<div style=\"font-size: 14px; line-height: 20px; font-weight: 500\">Ramp<\/div>\n<div style=\"font-size: 13px; line-height: 18px; font-weight: 300; color: #707062\">to David Wallace<\/div>\n<\/div>\n<div style=\"font-size: 13px; line-height: 18px; font-weight: 300; color: #707062\">Sun, Nov 15, 9:02 AM<\/div>\n<\/div>\n<\/div>\n\n<!-- Email body -->\n<div style=\"fle  13px; line-height: 18px; font-weight: 300; color: #707062\">Sun, Nov 15, 9:06 AM<\/div>\n<\/div>\n<\/div>\n\n<div style=\"flex: 1 1 auto; min-height: 0; overflow: hidden; padding: 32px 0 40px; display: flex; justify-content: center\">\n<article style=\"width: 600px; background: #ffffff; align-self: flex-start\">\n<div style=\"display: flex; align-items: center; justify-content: space-between; padding: 20px 40px; border-bottom: 1px solid #f4f3ef; font-size: 15px; line-height: 22px; font-weight: 600\">Ramp<span style=\"font-size: 12px; font-weight: 300; color: #707062\">Halvorsen Heating &amp; Plumbing<\/span><\/div>\n\n<div style=\"padding: 28px 40px 4px\">\n<div style=\"display: inline-flex; align-items: center; gap: 6px; height: 24px; box-sizing: border-box; padding: 0 10px 0 8px; border: 1px solid #876634; border-radius: 907px; background: #feffe1; font-size: 12px; line-height: 20px; font-weight: 400; color: #876634\">\n<svg width=\"12\" height=\"12\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" aria-hidden=\"true\"><circle cx=\"8\" cy=\"8\" r=\"6.2\"/><path d=\"M8 4.8V8l2.2 1.4\"/><\/svg>Order by Feb 1 to have vans before spring\n<\/div>\n<h1 style=\"margin: 14px 0 0; font-size: 22px; line-height: 30px; font-weight: 400; letter-spacing: -0.3px\">6 of your 25 vans are past the mileage where similar companies replace them. 3 already cost more to keep than to replace.<\/h1>\n<p style=\"margin: 12px 0 0; font-size: 14px; line-height: 22px; font-weight: 300\">Hi Dana, you\u2019re getting this as Halvorsen\u2019s operations manager and the owner of the fleet budget. Each van has its own Ramp card, so we can see repair spend van by van. For vans 04, 09 and 11, next year\u2019s expected repairs are more than a new van costs per year.<\/p>\n<\/div>\n\n<div style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin: 20px 40px 0; border: 1px solid #ebe8e5\">\n<div style=\"padding: 16px; border-right: 1px solid #ebe8e5\"><div class=\"lb\">Replace 3 vans now<\/div><div style=\"font-size: 18px; line-height: 26px; font-weight: 400; margin-top: 4px\">About $141,000<\/div><div class=\"lb\" style=\"margin-top: 2px\">$163,500 less $22,500 trade-in<\/div><\/div>\n<div style=\"padding: 16px; border-right: 1px solid #ebe8e5\"><div class=\"lb\">Repairs if you keep them<\/div><div style=\"font-size: 18px; line-height: 26px; font-weight: 400; margin-top: 4px\">~$25,500 next year<\/div><div class=\"lb\" style=\"margin-top: 2px\">vs ~$22,200 a year for 3 new vans<\/div><\/div>\n<div style=\"padding: 16px\"><div class=\"lb\">Lead time for new vans<\/div><div style=\"font-size: 18px; line-height: 26px; font-weight: 400; margin-top: 4px\">About 10 weeks<\/div><div class=\"lb\" style=\"margin-top: 2px\">Order Feb 1, on the road mid-April<\/div><\/div>\n<\/div>\n\n<div style=\"margin: 20px 40px 0; padding: 18px 20px; background: #f2f5f9; border: 1px solid #5683d2\">\n<div style=\"display: flex; align-items: center; gap: 8px; font-size: 12px; line-height: 16px; font-weight: 500; color: #4667a4\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M8 1.5v13M1.5 8h13M3.4 3.4l9.2 9.2M12.6 3.4l-9.2 9.2\"/><\/svg>Our recommendation<\/div>\n<div style=\"margin-top: 8px; font-size: 16px; line-height: 24px; font-weight: 500\">Replace vans 04, 09 and 11 before spring. Check the other 3 next fall.<\/div>\n<p style=\"margin: 6px 0 0; font-size: 14px; line-height: 22px; font-weight: 300\">Past 130K miles, repair bills for similar companies\u2019 vans rose about 40% a year. At that rate, these 3 will cost more to keep next year than a new van costs per year: its price after trade-in spread over 7 years, plus routine upkeep.<\/p>\n<\/div>\n\n<div style=\"margin: 20px 40px 0\">\n<div style=\"font-size: 14px; line-height: 20px; font-weight: 500\">Your vans past replacement mi style=\"display: flex; align-items: center; justify-content: space-between; padding: 12px 16px 16px; border-top: 4px solid #ebe8e5\">\n<div><div style=\"font-size: 12px; line-height: 16px; font-weight: 300; color: #707062\">Total<\/div><div style=\"font-size: 20px; line-height: 28px; font-weight: 400\">{{total}}<\/div><\/div>\n<span style=\"height: 32px; box-sizing: border-box; display: inline-flex; align-items: center; gap: 8px; padding: 0 12px; background: #f4f3ef; border-radius: 907px; font-size: 14px; line-height: 20px\">USD<svg width=\"10\" height=\"10\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m4 6 4 4 4-4\"/><\/svg><\/span>\n<\/div>\n<\/div>\n<div style=\"margin-top: 12px; padding: 14px 16px; background: #f2f5f9; border: 1px solid #5683d2\">\n<div style=\"display: flex; align-items: center; gap: 8px; font-size: 12px; line-height: 16px; font-weight: 400; color: #4667a4\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M8 1.5v13M1.5 8h13M3.4 3.4l9.2 9.2M12.6 3.4l-9.2 9.2\"/><\/svg>Price Intelligence<\/div>\n<div style=\"display: flex; align-items: center; gap: 16px; margin-top: 6px\">\n<p style=\"flex: 1; margin: 0; font-size: 14px; line-height: 20px; font-weight: 300; color: #2e2e27\">Peers paid <b style=\"font-weight: 500\">$52,900 per van<\/b> at Midstate Fleet Sales in the last 6 months (41 vans, 12 companies). Your last order there, in Mar 2025, was $54,500.<\/p>\n<sc-if value=\"{{peerOff}}\"><button type=\"button\" class=\"bo sm\" onClick=\"{{usePeer}}\">Use $52,900<\/button><\/sc-if>\n<sc-if value=\"{{peerOn}}\"><span class=\"ok\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m3.5 8.3 2.8 2.8 6.2-6.4\"/><\/svg>Rate updated<\/span><button type=\"button\" class=\"lnk\" onClick=\"{{undoPeer}}\">Undo<\/button><\/sc-if>\n<\/div>\n<\/div>\n<div style=\"margin-top: 8px; font-size: 12px; line-height: 16px; font-weight: 300; color: #707062\">Trade-in value from your last van order with this dealer (Mar 2025)<\/div>\n\n<h2 class=\"q\">Vendor<\/h2>\n<div class=\"fl\" style=\"height: 52px; margin-top: 4px\"><span class=\"vl\" style=\"display: flex; align-items: center; gap: 10px\"><span style=\"width: 24px; height: 24px; border-radius: 907px; background: #f4f3ef; border: 1px solid #ebe8e5; box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 400; color: #707062\">M<\/span><span style=\"flex: 1\">Midstate Fleet Sales<\/span><svg width=\"12\" height=\"12\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m4 6 4 4 4-4\"/><\/svg><\/span><\/div>\n<div style=\"margin-top: 8px; font-size: 12px; line-height: 16px; font-weight: 300; color: #707062\">Your last 4 van purchases were from this dealer, paid through bill pay<\/div>\n\n<h2 class=\"q\">What problem are you trying to solve and why do you need to buy this?<span style=\"display: inline-flex; align-items: center; gap: 6px; margin-left: 10px; height: 22px; box-sizing: border-box; padding: 0 8px; vertical-align: 2px; background: #f2f5f9; border: 1px solid #5683d2; border-radius: 907px; font-size: 12px; line-height: 16px; font-weight: 400; color: #4667a4\">Drafted by Ramp<\/span><\/h2>\n<div class=\"ans\">Vans 04, 09 and 11 are past 130K miles. At the rate repair bills rose for similar companies\u2019 vans at that mileage, they\u2019ll cost about $25,500 in repairs next year, more than the $22,200 a year that 3 new vans would cost. Replacing them before the April busy season also means fewer days in the shop when crews need them most. Vans 15, 17 and 22 are past replacement mileage too, but still cheaper to keep; Ramp will check them again next fall.<\/div>\n\n<h2 class=\"q\">Does this fit into your approved budget?<span style=\"display: inline-flex; align-items: center; gap: 6px; margin-left: 10px; height: 22px; box-sizing: border-box; padding: 0 8px; vertical-align: 2px; background: #f2f5f9; border: 1px solid #5683d2; border-radius: 907px; font-size: 12px; line-height: 16px; font-weight: 400; color: #4667a4\">Drafted by Ramp<\/span><\/h2>\n<div style=\"margin-top: 8px\"><label class=\"rd\"><input type=\"radio\" name=\"budget\" checked>Yes<\/label><label class=\"rd\"><input type=\"radio\" name=\"budget\">No<\/label><\/div>\n<div style=\"margin-top: 4px; font-size: 12px; line-height: 16px; font-weight: 300; color: #707062\">2027 Fleet budget in Ramp: $180,000, nothing committed yet. This order uses {{budgetUse}}.<\/div>\n\n<h2 class=\"q\">When do you need this procured by?<span style=\"display: inline-flex; align-items: center; gap: 6px; margin-left: 10px; height: 22px; box-sizing: border-box; padding: 0 8px; vertical-align: 2px; background: #f2f5f9; border: 1px solid #5683d2; border-radius: 907px; font-size: 12px; line-height: 16px; font-weight: 400; color: #4667a4\">Drafted by Ramp<\/span><\/h2>\n<div class=\"ans\" style=\"display: flex; justify-content: space-between; align-items: center\">Feb 1, 2027<svg width=\"14\" height=\"14\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\" stroke-linecap=\"round\" aria-hidden=\"true\"><rect x=\"2.3\" y=\"3\" width=\"11.4\" height=\"10.7\" rx=\"1.2\"/><path d=\"M2.3 6.3h11.4M5.3 1.8v2.4M10.7 1.8v2.4\"/><\/svg><\/div>\n<\/div>\n<\/div>\n\n<div style=\"flex: 0 0 89px; height: 89px; box-sizing: border-box; display: flex; align-items: center; gap: 16px; padding: 0 40px 0 40px; background: #ffffff; border-top: 1px solid #ebe8e5\">\n<a href=\"Email3.dc.html\" class=\"bo\">Cancel<\/a>\n<span style=\"flex: 1\"><\/span>\n<span style=\"display: inline-flex; align-items: center; gap: 6px; font-size: 14px; line-height: 20px; font-weight: 300; color: #707062\">Approvals: Owner, then Finance<\/span>\n<button type=\"button\" class=\"bo\">Save draft<\/button>\n<a href=\"#\" class=\"by\" data-action>Request<\/a>\n<\/div>\n<\/section>\n<\/div>\n<\/div>\n"}];
  const row = document.getElementById('row'), nav = document.getElementById('nav');
  const capEl = document.getElementById('cap'), countEl = document.getElementById('count');
  const prev = document.getElementById('prev'), next = document.getElementById('next');
  let cur = 0, size = { w: 0, h: 0, s: 1, step: 0 };
  const slides = SCREENS.map((scr, i) => {
    const sl = document.createElement('div'); sl.className = 'slide';
    sl.innerHTML = '<div class="win"><div class="bar"><div class="lights"><span style="background:#ff5f57"></span><span style="background:#febc2e"></span><span style="background:#28c840"></span></div><div class="url"><svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="7" width="10" height="7.5" rx="1.5"/><path d="M5.2 7V5a2.8 2.8 0 0 1 5.6 0v2"/></svg><span></span></div></div><div class="view"><div class="screen"></div></div></div>';
    sl.querySelector('.url span').textContent = scr.url;
    row.appendChild(sl);
    return { el: sl, mounted: false, scr };
  });
  // One continuous row of dots.
  SCREENS.forEach((scr, i) => {
    const b = document.createElement('button'); b.type = 'button'; b.setAttribute('aria-label', scr.groupLabel + ', step ' + (i + 1) + ' of ' + SCREENS.length);
    b.innerHTML = '<i></i>'; b.addEventListener('click', () => go(i)); nav.appendChild(b);
  });
  const dots = [...nav.querySelectorAll('button')];
  function goName(name) { const i = SCREENS.findIndex(s => s.name === name); if (i >= 0) go(i); }
  function ensure(i) {
    const s = slides[i]; if (!s || s.mounted) return;
    s.mounted = true; window.mountScreen(s.el.querySelector('.screen'), s.scr, goName);
  }
  function layout() {
    const W = row.clientWidth, H = row.clientHeight;
    const side = W < 900 ? 16 : 100, aspect = 907 / 1725;
    let cw = Math.min(W - side * 2, (H - 28 - 41) / aspect); cw = Math.max(320, Math.floor(cw));
    size = { w: cw, h: Math.round(cw * aspect), s: cw / 1725, step: cw + Math.max(160, (W - cw) / 2 + 40) };
    slides.forEach(s => {
      s.el.style.width = size.w + 'px';
      s.el.querySelector('.view').style.height = size.h + 'px';
      const sc = s.el.querySelector('.screen'); if (s.scr.email) { sc.style.width = '1280px'; sc.style.height = '673px'; sc.style.transform = 'scale(' + (size.w / 1280) + ')'; sc.style.setProperty('--k', 1280 / size.w); } else { sc.style.transform = 'scale(' + size.s + ')'; sc.style.setProperty('--k', 1 / size.s); }
    });
    place(false);
  }
  function place(animate) {
    slides.forEach((s, i) => {
      const d = i - cur;
      if (!animate) s.el.style.transition = 'none';
      s.el.style.transform = 'translateX(calc(-50% + ' + (d * size.step) + 'px))';
      s.el.style.opacity = d === 0 ? '1' : (Math.abs(d) === 1 ? '0.0' : '0');
      s.el.setAttribute('aria-hidden', d === 0 ? 'false' : 'true');
      s.el.inert = d !== 0;
      if (!animate) { s.el.offsetHeight; s.el.style.transition = ''; }
    });
  }
  function setCaption(animate) {
    const s = SCREENS[cur];
    const write = () => { capEl.innerHTML = ''; const b = document.createElement('strong'); b.textContent = s.lead + ' '; capEl.append(b, document.createTextNode(s.rest)); };
    countEl.textContent = (cur + 1) + ' of ' + SCREENS.length;
    if (!animate) { write(); return; }
    capEl.classList.add('out'); setTimeout(() => { write(); capEl.classList.remove('out'); }, 200);
  }
  function go(i, fromHash) {
    i = Math.max(0, Math.min(SCREENS.length - 1, i)); if (i === cur && slides[i].mounted) return;
    cur = i; ensure(i); ensure(i + 1); ensure(i - 1);
    place(true); setCaption(true);
    dots.forEach((d, j) => d.setAttribute('aria-current', j === cur ? 'step' : 'false'));
    prev.disabled = cur === 0; next.disabled = cur === SCREENS.length - 1;
    if (!fromHash) { try { history.replaceState(null, '', '#step-' + (cur + 1)); } catch (e) { location.hash = 'step-' + (cur + 1); } }
  }
  prev.addEventListener('click', () => go(cur - 1));
  next.addEventListener('click', () => go(cur + 1));
  document.addEventListener('keydown', e => {
    const t = e.target; if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) return;
    if (e.key === 'ArrowRight') go(cur + 1); else if (e.key === 'ArrowLeft') go(cur - 1);
  });
  function fromHash() { const m = (location.hash || '').match(/^#step-(\d+)$/); return m ? +m[1] - 1 : 0; }
  window.addEventListener('hashchange', () => go(fromHash(), true));
  window.addEventListener('resize', layout);
  cur = fromHash(); ensure(cur); ensure(cur + 1); ensure(cur - 1);
  layout(); setCaption(false);
  dots.forEach((d, j) => d.setAttribute('aria-current', j === cur ? 'step' : 'false'));
  prev.disabled = cur === 0; next.disabled = cur === SCREENS.length - 1;
  setTimeout(() => SCREENS.forEach((_, i) => ensure(i)), 1500);
})();
